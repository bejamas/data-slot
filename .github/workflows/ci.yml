name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build before the type check: tsconfig.json `paths` does not map every
      # package, so `tsc` resolves some @data-slot/* imports through their
      # built dist/*.d.ts files.
      - name: Build packages
        run: bun run build

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Verify published UI exports
        run: bun run test:ui:published
