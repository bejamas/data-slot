<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carousel local regression checks</title>
<style>
  body { font: 16px system-ui; margin: 24px; }
  section { margin-block: 32px; }
  [data-slot=carousel] { max-width: 1280px; }
  [data-slot=carousel-content] { display:flex; overflow:auto; gap:20px; scroll-snap-type:x mandatory; }
  [data-slot=carousel-item] { flex:0 0 360px; box-sizing:border-box; background:#eee; padding:24px; scroll-snap-align:start; }
  [data-slot=carousel-item][inert] { opacity:.45; }
  #single [data-slot=carousel-item] { flex-basis:100%; }
  [data-slot=carousel-indicators] { display:inline-flex; gap:8px; margin:12px; }
  [data-slot=carousel-indicator] { width:20px; height:20px; border-radius:50%; border:1px solid #777; }
  [data-slot=carousel-indicator][aria-current] { background:#222; }
  @media (width < 768px) { #responsive [data-slot=carousel-content] { scroll-snap-type:none; } }
</style>
<h1>Carousel local regression checks</h1>
<p>Tab through visible card links, use Previous/Next and dots, and drag the card backgrounds. Resize the window to change the number of reachable positions.</p>
<section><h2>Multiple visible cards</h2><div id="multiple" data-slot="carousel" data-slides="multiple" data-drag></div></section>
<section><h2>Free scroll</h2><div id="free" data-slot="carousel" data-slides="multiple" data-snap="none" data-drag></div></section>
<section><h2>Responsive free scroll below 768px</h2><div id="responsive" data-slot="carousel" data-slides="multiple" data-drag></div></section>
<section><h2>Default full-width slides</h2><div id="single" data-slot="carousel" data-drag></div></section>
<script type="module">
  import { createCarousel } from '/carousel.js';
  window.carousels = {};
  for (const root of document.querySelectorAll('[data-slot=carousel]')) {
    root.innerHTML = `<div data-slot="carousel-content" tabindex="0">${Array.from({length:5}, (_, i) =>
      `<div data-slot="carousel-item"><h3>Card ${i+1}</h3><a href="#card-${i+1}">Open card ${i+1}</a></div>`).join('')}</div>
      <button data-slot="carousel-previous">Previous</button>
      <button data-slot="carousel-next">Next</button>
      <div data-slot="carousel-indicators" aria-label="Choose a position"></div>
      <span role="status"></span>`;
    const controller = createCarousel(root);
    window.carousels[root.id] = controller;
    const counter = () => root.querySelector('[role=status]').textContent = `Position ${controller.index+1} of ${controller.count}`;
    root.addEventListener('carousel:change', counter);
    new ResizeObserver(counter).observe(root);
    counter();
  }
</script>
</html>
